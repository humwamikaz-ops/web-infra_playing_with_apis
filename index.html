<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale=1.0">

        <title>Country</title>
        <link rel="stylesheet" href="index.css"/>
    </head>
    <body>
        <header>
            <div class="nav">
                <a class="active" href="index.html">🌐</a>
                <a href="about.html">About</a>

            </div>
        </header>
        <main>
            <section>
                <h1>KNOW YOUR COUNTRIES</h1>
                <p class="tagline">Compare countries by region, population and area.</p>
            </section>
            <section id="explore">
                <div class="controls">
                    <label for="search" class="sr-only">Search countries</label>
                    <input type="text" id="search" placeholder="Search by country name">
                    <select id="region">
                        <option value="">All regions</option>
                        <option value="Africa">Africa</option>
                        <option value="Americas">America</option>
                        <option value="Asia">Asia</option>
                        <option value="Europe">Europe</option>
                        <option value="Oceania">Oceania</option>

                    </select>
                    <select id="sort">
                        <option value="name">Name (A-Z)</option>
                        <option value="population">Population</option>
                        <option value="area">Area</option>

                    </select>
                </div>
                <p id="status" aria-live="polite"></p>
                <div id="countries"></div>
                    
            </section>
        </main>
        <footer><p>© 2026 Country. All Rights Reserved 🙇</p></footer>
        <dialog id="detail">
            <button id="detail-close" aria-label="Close">X</button>
            <div id="detail-body"></div>
        </dialog>
        <script src="config.js"></script>
        <script src="index.js"></script>
    </body>
</html>
